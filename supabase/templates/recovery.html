<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password · DigiDrobe</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f2eb;color:#25221f;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f6f2eb">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#fffcf6" style="width:100%;max-width:560px;background-color:#fffcf6;border:1px solid #d7cdbf;border-top:4px solid #49372e;">
          <tr>
            <td style="padding:24px 24px 17px;border-bottom:1px solid #d7cdbf;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="42" valign="middle"><img src="{{ .SiteURL }}/fabric-d-mark.webp" width="32" height="32" alt="" style="display:block;border:0;"></td>
                  <td valign="middle" style="font-family:Georgia,'Times New Roman',serif;font-size:25px;line-height:1.1;letter-spacing:-0.9px;color:#25221f;">DigiDrobe</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 24px;">
              <p style="margin:0 0 12px;font-size:12px;line-height:1.4;letter-spacing:1.5px;text-transform:uppercase;color:#824c3f;">Digital Wardrobe</p>
              <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:1.14;letter-spacing:-0.8px;font-weight:400;color:#25221f;">Reset your password</h1>
              <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#655c54;">We received a request to reset the password for your DigiDrobe account.</p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#49372e" style="background-color:#49372e;border-radius:3px;mso-padding-alt:14px 20px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;font-size:15px;font-weight:bold;line-height:1.2;color:#fffdf8;text-decoration:none;">Choose a new password</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td bgcolor="#eee3d5" style="padding:18px 24px;background-color:#eee3d5;border-top:1px solid #d7cdbf;">
              <p style="margin:0;font-size:13px;line-height:1.55;color:#655c54;">If you didn’t request this, you can ignore this email. Your password stays the same.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
